[project]
name = "jean-code"
version = "0.1.0"
description = "A fully fledged agent with subagents, tool calling, skills and event-stream tracing, with a terminal REPL and a Streamlit UI."
authors = [
    { name = "opitcho", email = "oscar.pitcho@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "griffelib>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.63.0",
]

[project.scripts]
jean-code = "jean_code.ui.repl:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "BLE",     # blind except: catch-alls only at deliberate boundaries, each with a noqa saying why
    "S",       # bandit
    "T20",     # print outside the front-ends
    "PLE", "PLW",  # pylint errors and warnings
    "D",       # docstrings, Google style
    "SLF001",  # private access, in ui/ only (see per-file-ignores): a client reads the view, not the driver's agent
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: curly quotes, dashes and ✓/⚠ are deliberate (agents/research.py)
    "D1",  # a docstring isn't required: obvious helpers go without
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # assert is how pytest checks; test docstrings are free-form
"tests/test_research.py" = ["E501"]  # verbatim quotes from real pages, split across literals
"src/jean_code/ui/repl.py" = ["T20"]  # the terminal front-end prints
"!src/jean_code/ui/**" = ["SLF001"]  # only clients are held to the driver's public surface
"src/jean_code/tools/shell.py" = ["S603", "S607"]  # running commands is the point; `docker` is found on PATH
"tests/test_shell.py" = ["S603"]  # asks docker whether the sandbox image exists, with a fixed command

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
executionEnvironments = [
    # A test reading a field of an Optional (an outcome, a subagent) fails on None anyway.
    { root = "tests", extraPaths = ["tests"], reportOptionalMemberAccess = false },
    { root = "src" },
]
